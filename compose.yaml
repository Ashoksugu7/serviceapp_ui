services:
  ui:
    build:
      context: .
    image: serviceops360-ui:latest
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
    ports:
      - ${UI_PORT:-3000}:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
